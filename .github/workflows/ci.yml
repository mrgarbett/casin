name: CI

on:
  # Branches with a PR are built by pull_request; push only builds main.
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fedora:
    name: Fedora (GTK4 + libadwaita, RPM)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git gcc-c++ cmake ninja-build pkgconfig gtk4-devel libadwaita-devel \
                         cairo-devel pango-devel desktop-file-utils libappstream-glib \
                         rpm-build rpmdevtools xorg-x11-server-Xvfb google-noto-sans-fonts
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Render the demo map and a window screenshot
        run: |
          ./build/src/gtk/restricto --render-map demo-map.png --enzymes all samples/pOC-demo.dna
          xvfb-run -a env GSK_RENDERER=cairo ./build/src/gtk/restricto \
              --screenshot window.png --size 1440x900 --select 170-892 samples/pOC-demo.dna
      - name: Build the RPM
        run: |
          git config --global --add safe.directory "$PWD"
          rpmdev-setuptree
          git archive --prefix=restricto-0.1.0/ -o ~/rpmbuild/SOURCES/restricto-0.1.0.tar.gz HEAD
          rpmbuild -ba packaging/fedora/restricto.spec
          cp ~/rpmbuild/RPMS/*/restricto-*.rpm .
          ls -l restricto-*.rpm | tee -a "$GITHUB_STEP_SUMMARY"
          rpm -qp --queryformat '%{NAME} installed: %{SIZE} bytes\n' restricto-*.rpm | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-build
          path: |
            demo-map.png
            window.png
            restricto-*.rpm

  flatpak:
    name: Flatpak (GNOME runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder and the GNOME SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 blocks the user namespaces that bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the Flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
              --repo=build-flatpak/repo build-flatpak/app packaging/flatpak/io.github.mrgarbett.Restricto.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
              build-flatpak/repo restricto.flatpak io.github.mrgarbett.Restricto
          ls -l restricto.flatpak | tee -a "$GITHUB_STEP_SUMMARY"
          du -sk build-flatpak/app/files | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test inside the sandbox
        run: |
          sudo apt-get install -y dbus-daemon fuse3
          flatpak install --user -y --noninteractive ./restricto.flatpak
          out="$HOME/.var/app/io.github.mrgarbett.Restricto/demo-map.png"
          mkdir -p "$(dirname "$out")"
          # The document portal needs a session bus.
          dbus-run-session -- flatpak run --file-forwarding io.github.mrgarbett.Restricto \
              --render-map "$out" @@ "$PWD/samples/pOC-demo.dna" @@
          test -s "$out"
          # Without forwarding the host file is invisible; the error must say what to do.
          if flatpak run io.github.mrgarbett.Restricto --render-map "$out" "$PWD/samples/pOC-demo.dna" 2>err.txt; then
              echo "expected the unforwarded run to fail"; exit 1
          fi
          cat err.txt
          grep -q -- "--file-forwarding" err.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: restricto.flatpak

  macos:
    # Two SDKs: macos-14 builds without the Liquid Glass code (older Xcode),
    # macos-26 builds it in with Xcode 26. Both binaries target macOS 13.
    name: macOS ${{ matrix.label }} (Swift + AppKit)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            label: pre-26 SDK
            artifact: macos-build
          - runner: macos-26
            label: Xcode 26 SDK
            artifact: macos-build-xcode26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core tests
        run: |
          brew install ninja
          cmake -S . -B build -G Ninja -DRESTRICTO_FRONTEND=none
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Build Restricto.app
        run: scripts/build_macos_app.sh
      - name: Check the deployment target is still Ventura
        run: |
          vtool -show-build build/macos/Restricto.app/Contents/MacOS/Restricto | tee vtool.txt
          grep -Eq 'minos 13\.0' vtool.txt
          test -s build/macos/Restricto.app/Contents/Resources/Restricto.icns
          # AppKit picks the macOS 26 design from the SDK version in the binary.
          test "$(awk '$1 == "sdk" { print $2 }' vtool.txt)" = "$(xcrun --show-sdk-version)"
      - name: App size
        run: du -sk build/macos/Restricto.app | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Headless map render
        run: build/macos/Restricto.app/Contents/MacOS/Restricto --render-map demo-map-macos.png samples/pOC-demo.dna
      - name: Launch the window (twice, the second from the saved narrow frame)
        timeout-minutes: 4
        run: |
          APP=build/macos/Restricto.app/Contents/MacOS/Restricto
          "$APP" --ui-smoke ui-first-launch samples/pOC-demo.dna
          "$APP" --ui-smoke ui-second-launch samples/pOC-demo.dna
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            demo-map-macos.png
            ui-first-launch
            ui-second-launch
            build/macos/Restricto.app
