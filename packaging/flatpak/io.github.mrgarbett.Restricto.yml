# Flatpak manifest for the GTK app. From the repo root, build and install:
#   flatpak-builder --user --install-deps-from=flathub --force-clean --install \
#       build-flatpak/app packaging/flatpak/io.github.mrgarbett.Restricto.yml
# or build into a repo and make a single-file bundle:
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#       --repo=build-flatpak/repo build-flatpak/app packaging/flatpak/io.github.mrgarbett.Restricto.yml
#   flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
#       build-flatpak/repo restricto.flatpak io.github.mrgarbett.Restricto
# The sandbox can't see host files, so pass them on the command line through
# the document portal:
#   flatpak run --file-forwarding io.github.mrgarbett.Restricto @@ samples/pOC-demo.dna @@
# The app ID follows the current packaging names; it moves to
# io.github.mrgarbett.Restricto with the rename.
id: io.github.mrgarbett.Restricto
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: restricto
finish-args:
  # Files are opened and saved through the portal (GtkFileDialog, drag and drop),
  # so no filesystem access is requested.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: restricto
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-flatpak
          - .flatpak-builder
